[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-transcription-service"
version = "0.1.0"
description = "Local CLI to transcribe video and audio: MLX on Apple Silicon, faster-whisper elsewhere"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "josetseph" }]
keywords = ["whisper", "transcription", "speech-to-text", "mlx", "apple-silicon", "cli"]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    # Imported directly by --live and by model setup; nothing else guarantees them.
    "numpy",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "huggingface_hub>=0.24",
    # System audio for --live: a Core Audio process tap on macOS; WASAPI loopback
    # or a PulseAudio/PipeWire monitor elsewhere.
    "pyobjc-framework-CoreAudio>=12.2; sys_platform == 'darwin'",
    "soundcard>=0.4.6; sys_platform != 'darwin'",
    # One engine per platform, so a bare install works everywhere: MLX uses the
    # GPU on Apple Silicon, faster-whisper covers Linux, Windows and Intel Macs.
    "mlx-qwen3-asr>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.0; not (sys_platform == 'darwin' and platform_machine == 'arm64')",
]

[project.urls]
Homepage = "https://github.com/josetseph/local-transcription-service"
Repository = "https://github.com/josetseph/local-transcription-service"
Issues = "https://github.com/josetseph/local-transcription-service/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
diarize = ["pyannote.audio>=4.0"]
# --summarize. On Apple Silicon build with Metal:
#   CMAKE_ARGS="-DGGML_METAL=on" pip install llama-cpp-python
summarize = ["llama-cpp-python>=0.3.34"]
# Force an engine regardless of platform (e.g. faster-whisper on Apple Silicon).
mlx = ["mlx-whisper>=0.4"]
qwen = ["mlx-qwen3-asr>=0.4"]
faster-whisper = ["faster-whisper>=1.0"]

[project.scripts]
transcribe = "local_transcription_service.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_transcription_service"]

[tool.hatch.build.targets.sdist]
include = ["src/local_transcription_service", "config.example.yaml"]
