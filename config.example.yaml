# Copy to config.yaml (project root) or
# ~/.config/local-transcription-service/config.yaml
#
# Every model can be a plain local directory. Pointing model_path at a folder
# skips the HuggingFace cache entirely, and for diarization it also removes the
# access-token requirement.

whisper:
  # auto | qwen | mlx | faster-whisper
  # auto follows the local model's on-disk format when model_path is set,
  # otherwise the platform (qwen on Apple Silicon, faster-whisper elsewhere).
  engine: auto

  # Existing model folder. The layout selects the engine when engine is auto:
  #   Qwen3-ASR    config.json naming a Qwen3-ASR architecture + safetensors
  #   MLX          config.json + weights.safetensors (or weights.npz)
  #   CTranslate2  model.bin
  # Leave empty to download model_id instead.
  model_path: ""

  # Download cache used when model_path is empty or does not match the engine.
  # HuggingFace repos land in <models_root>/huggingface.
  models_root: ~/.cache/transcribe-models

  # Model id for downloads. null picks the default for the selected engine:
  #   qwen            Qwen/Qwen3-ASR-1.7B
  #   mlx             mlx-community/whisper-large-v3-mlx
  #   faster-whisper  Systran/faster-whisper-large-v3
  model_id: null

  # null = auto-detect
  language: null

  # Space-separated domain terms biasing recognition (qwen only). Only helps for
  # words actually spoken; padding it out risks the model inserting them.
  context: ""

  # Forced-aligner folder for word timings (qwen only). --diarize and
  # --word-timestamps need it. Empty fetches Qwen/Qwen3-ForcedAligner-0.6B.
  aligner_path: ""

  # faster-whisper only. MLX and qwen always use the Apple GPU.
  device: auto
  compute_type: int8

# Speaker diarization (optional; needs the "diarize" extra)
diarization:
  # A plain pipeline folder needs no HuggingFace token: its config.yaml resolves
  # the $model/ sub-models relative to itself.
  model_path: ""
  # Used when model_path is empty. This copy is byte-identical to the gated
  # pyannote/speaker-diarization-community-1 but needs no HuggingFace token.
  model_id: pyannote-community/speaker-diarization-community-1
  # Seconds between analysis windows. pyannote defaults to 1.0; 2.0 measured
  # ~1.9x faster at 95.7% agreement with that default on an M3. 3.0 begins
  # merging speakers.
  step: 2.0
  # Read from HF_TOKEN / HUGGINGFACE_TOKEN when null.
  token: null
  # Exact count when known; null lets clustering decide.
  speakers: null
  # Bounds when the exact count is unknown.
  min_speakers: null
  max_speakers: null

# --summarize (optional; needs the "summarize" extra)
summary:
  # A GGUF chat model file, run in-process by llama.cpp. Nothing is downloaded.
  model_path: ""
  # Context window. 32768 holds about two and a half hours of speech in one pass; longer
  # recordings are summarized in parts and merged. Lower it if memory is tight.
  n_ctx: 32768
