# Copy to config.yaml (project root) or
# ~/.config/local-transcription-service/config.yaml
#
# Point models_root / model_path at a local SSD, external drive, or NAS.
# Example (external/NAS): /Volumes/NAS/Projects/models

whisper:
  # Where faster-whisper downloads CT2 bundles when model_path is unset/invalid.
  models_root: ~/.cache/whisper-models
  # Existing CTranslate2 folder (must contain model.bin). Leave empty to use model_id.
  model_path: ""
  # HuggingFace CT2 id used when model_path is missing or invalid.
  model_id: Systran/faster-whisper-large-v3
  device: auto
  compute_type: int8
  # null = auto-detect language
  language: null
