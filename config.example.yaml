# Copy to config.yaml (project root) or
# ~/.config/local-transcription-service/config.yaml
#
# Point models_root / model_path at a local SSD, external drive, or NAS.
# Example (external/NAS): /Volumes/NAS/Projects/models

whisper:
  # auto | mlx | faster-whisper. auto follows the local model's format when
  # model_path is set, otherwise the platform (MLX on Apple Silicon).
  engine: auto
  # HuggingFace cache root for MLX model downloads when model_path is
  # unset/invalid (repos land in <models_root>/huggingface).
  models_root: ~/.cache/whisper-models
  # Existing model folder: MLX (config.json + weights) or CTranslate2
  # (model.bin). The format selects the engine when engine is auto.
  # Leave empty to use model_id.
  model_path: ""
  # Model id used when model_path is missing or invalid. null picks the default
  # for the selected engine: mlx-community/whisper-large-v3-mlx for mlx,
  # Systran/faster-whisper-large-v3 for faster-whisper.
  model_id: null
  # faster-whisper only; MLX always uses the Apple GPU.
  device: auto
  compute_type: int8
  # null = auto-detect language
  language: null

# Speaker diarization (optional; needs the "diarize" extra: pip install -e ".[diarize]")
diarization:
  # Gated on HuggingFace: accept the model's conditions, then set HF_TOKEN.
  model_id: pyannote/speaker-diarization-community-1
  # Seconds between analysis windows. pyannote defaults to 1.0; 2.0 measured
  # ~1.9x faster at 95.7% agreement on an M3, 3.0 begins merging speakers.
  step: 2.0
  # Read from HF_TOKEN / HUGGINGFACE_TOKEN when left null.
  token: null
  # Exact speaker count when known; null lets clustering decide.
  speakers: null
  # Bounds for the search when the exact count is unknown (null = unbounded).
  min_speakers: null
  max_speakers: null
